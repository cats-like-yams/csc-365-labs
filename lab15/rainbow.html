<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Rainbow</title>
	<style>
		body {margin:0;}
		div {width: 100%; height: 14.2857vh;}
		/* 100/7 colors = 14.2875 */
		p {margin: 0; text-align:center; padding: 3em 0;}
	</style>

  </head>
  <body>
	<script>
		"use strict";

		// Creates an array of rainbow colors
		const colors = ["red", "orange", "yellow", "green", "blue", "indigo", "violet"];

		// Loops through array using forEach
		colors.forEach(color => {
		
		// Creates a new div
		const div = document.createElement("div");

		// Sets the background color of div
		div.style.backgroundColor = color;

		// aAppends div to body
		document.body.appendChild(div);

		// Creats p element
		const p = document.createElement("p");

		// Sets text content
		p.textContent = color;

		// Appends p to div
		div.appendChild(p);
		});
	</script>
  </body>
</html>
